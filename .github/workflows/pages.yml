name: Deploy GitHub Pages

on:
  workflow_dispatch:
    inputs:
      approved_source_sha:
        description: Exact 40-character source SHA approved for this Pages deployment
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build approved Pages artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      LEAI_BUILD_SHA: ${{ github.sha }}
      APPROVED_SOURCE_SHA: ${{ inputs.approved_source_sha }}
      CHECKED_OUT_SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Check out selected source
        uses: actions/checkout@v7

      - name: Require exact approved source SHA
        run: |
          test "$APPROVED_SOURCE_SHA" = "$CHECKED_OUT_SOURCE_SHA"
          test "${#APPROVED_SOURCE_SHA}" -eq 40

      - name: Use Node 22.22.0
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify source and compose Pages artifact
        run: |
          npm run typecheck
          npm run test -- --run
          npm run test:scripts
          npm run build:production
          npm run build:pages
          npm run verify:pages
          npm run check:client-secrets

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/pages

  deploy:
    name: Deploy approved artifact
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
