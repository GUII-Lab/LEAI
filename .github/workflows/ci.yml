name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify React foundation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      LEAI_BUILD_SHA: ${{ github.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Use Node 22.22.0
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit and component tests
        run: npm run test -- --run

      - name: Run build-script tests
        run: npm run test:scripts

      - name: Build same-origin Heroku QA candidate
        env:
          LEAI_QA_BACKEND_SHA: ${{ vars.LEAI_QA_BACKEND_SHA }}
        run: |
          test "${#LEAI_QA_BACKEND_SHA}" -eq 40
          npm run build:heroku -- qa "$LEAI_QA_BACKEND_SHA"

      - name: Scan tracked client source and QA candidate
        run: npm run check:client-secrets -- dist/heroku/qa

      - name: Preserve QA release candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: leai-heroku-qa-frontend
          path: dist/heroku/qa/
          if-no-files-found: error
          retention-days: 1

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run Chromium, Firefox, and WebKit acceptance
        run: npm run test:e2e

      - name: Verify V12 switches and skip flow in the minified build
        run: |
          VITE_LEAI_ENVIRONMENT=local npm run build
          LEAI_E2E_BUILT=1 npx playwright test e2e/legacy-parity.spec.ts --grep "V12 preview keeps"

  deploy-qa:
    name: Deploy frontend to Heroku QA
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      LEAI_QA_BACKEND_SHA: ${{ vars.LEAI_QA_BACKEND_SHA }}
      HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
    steps:
      - name: Check out frontend source
        uses: actions/checkout@v7

      - name: Download verified QA frontend
        uses: actions/download-artifact@v8
        with:
          name: leai-heroku-qa-frontend
          path: dist/heroku/qa

      - name: Assemble and deploy the pinned QA release
        run: |
          set -euo pipefail
          if [ -z "$HEROKU_API_KEY" ]; then
            echo "HEROKU_API_KEY is required in GUII-Lab/LEAI repository secrets to deploy QA." >&2
            exit 1
          fi
          if ! [[ "$LEAI_QA_BACKEND_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "LEAI_QA_BACKEND_SHA must be the exact QA backend source commit." >&2
            exit 1
          fi

          backend_dir="$RUNNER_TEMP/leai-backend-release"
          git clone --no-checkout https://github.com/GUII-Lab/guiidatapipelines.git "$backend_dir"
          git -C "$backend_dir" fetch --no-tags origin main:refs/remotes/origin/main
          heroku_build_id="$(curl --fail --silent --show-error \
            -H 'Accept: application/vnd.heroku+json; version=3' \
            -H "Authorization: Bearer $HEROKU_API_KEY" \
            https://api.heroku.com/apps/guiidata-leai-qa/config-vars \
            | node -e 'let input=""; process.stdin.on("data", chunk => input += chunk); process.stdin.on("end", () => process.stdout.write(JSON.parse(input).LEAI_BUILD_ID ?? ""))')"
          if [ "$heroku_build_id" != "$LEAI_QA_BACKEND_SHA" ]; then
            echo "LEAI_QA_BACKEND_SHA does not match the active Heroku QA backend build." >&2
            exit 1
          fi
          heroku_home="$RUNNER_TEMP/heroku-home"
          mkdir -p "$heroku_home"
          printf 'machine git.heroku.com login _ password %s\n' "$HEROKU_API_KEY" > "$heroku_home/.netrc"
          chmod 600 "$heroku_home/.netrc"

          git -C "$backend_dir" remote add heroku https://git.heroku.com/guiidata-leai-qa.git
          HOME="$heroku_home" GIT_TERMINAL_PROMPT=0 git -C "$backend_dir" fetch --no-tags heroku main
          github_pin_ancestor=false
          if git -C "$backend_dir" merge-base --is-ancestor "$LEAI_QA_BACKEND_SHA" refs/remotes/origin/main; then
            github_pin_ancestor=true
          fi
          heroku_pin_ancestor=false
          if git -C "$backend_dir" merge-base --is-ancestor "$LEAI_QA_BACKEND_SHA" refs/remotes/heroku/main; then
            heroku_pin_ancestor=true
          fi
          if [ "$github_pin_ancestor" != true ] && [ "$heroku_pin_ancestor" != true ]; then
            echo "LEAI_QA_BACKEND_SHA is not in GitHub backend main or the current Heroku QA release history." >&2
            exit 1
          fi
          if ! git -C "$backend_dir" diff --quiet "$LEAI_QA_BACKEND_SHA" refs/remotes/heroku/main -- \
            . \
            ':(exclude)frontend_dist' \
            ':(exclude)db.sqlite3' \
            ':(exclude)scripts/dryrun_openai_responses.py' \
            ':(exclude)scripts/report_leai_schema.py'; then
            echo "Current QA release source differs from the pinned backend; refusing to replace it." >&2
            exit 1
          fi
          # Continue from the current QA-only Heroku history so the release is a fast-forward.
          git -C "$backend_dir" checkout --detach refs/remotes/heroku/main
          rm -rf "$backend_dir/frontend_dist"
          mkdir -p "$backend_dir/frontend_dist"
          cp -a dist/heroku/qa/. "$backend_dir/frontend_dist/"

          node scripts/check-client-secrets.mjs "$backend_dir/frontend_dist"
          node --input-type=module - "$backend_dir/frontend_dist/index.html" "$backend_dir/frontend_dist" <<'NODE'
          import { readFileSync, existsSync } from 'node:fs'
          import path from 'node:path'
          const html = readFileSync(process.argv[2], 'utf8')
          const root = process.argv[3]
          const assets = [...html.matchAll(/(?:src|href)="(\/assets\/[^"]+)"/g)].map((match) => match[1])
          if (assets.length === 0) throw new Error('Packaged index.html has no fingerprinted assets')
          for (const asset of assets) {
            if (!existsSync(path.join(root, asset.slice(1)))) throw new Error(`Missing packaged asset: ${asset}`)
          }
          NODE

          git -C "$backend_dir" add -f frontend_dist/
          artifact_diff_status=0
          git -C "$backend_dir" diff --cached --quiet || artifact_diff_status=$?
          if [ "$artifact_diff_status" -eq 0 ]; then
            echo "QA already contains this verified frontend artifact; continuing to live smoke checks."
            exit 0
          fi
          if [ "$artifact_diff_status" -ne 1 ]; then
            echo "Unable to compare the staged QA artifact." >&2
            exit "$artifact_diff_status"
          fi
          git -C "$backend_dir" config user.name "github-actions[bot]"
          git -C "$backend_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$backend_dir" commit -m "build: package LEAI QA frontend ${GITHUB_SHA}"

          HOME="$heroku_home" GIT_TERMINAL_PROMPT=0 git -C "$backend_dir" push https://git.heroku.com/guiidata-leai-qa.git HEAD:main

      - name: Verify deployed QA frontend and backend
        run: node scripts/smoke-check-heroku-qa.mjs https://guiidata-leai-qa-f30daf4812c3.herokuapp.com "$GITHUB_SHA" "$LEAI_QA_BACKEND_SHA"
