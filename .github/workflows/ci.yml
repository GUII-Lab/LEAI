name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify React foundation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      LEAI_BUILD_SHA: ${{ github.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Use Node 22.22.0
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit and component tests
        run: npm run test -- --run

      - name: Run build-script tests
        run: npm run test:scripts

      - name: Build same-origin Heroku QA candidate
        env:
          LEAI_QA_BACKEND_SHA: ${{ vars.LEAI_QA_BACKEND_SHA }}
        run: |
          test "${#LEAI_QA_BACKEND_SHA}" -eq 40
          npm run build:heroku -- qa "$LEAI_QA_BACKEND_SHA"

      - name: Scan tracked client source and QA candidate
        run: npm run check:client-secrets -- dist/heroku/qa

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run Chromium, Firefox, and WebKit acceptance
        run: npm run test:e2e
