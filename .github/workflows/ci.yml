name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify React foundation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      LEAI_BUILD_SHA: ${{ github.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Use Node 22.22.0
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit and component tests
        run: npm run test -- --run

      - name: Run build-script tests
        run: npm run test:scripts

      - name: Build Production candidate
        run: npm run build:production

      - name: Build and verify Pages candidate
        run: |
          npm run build:pages
          npm run verify:pages

      - name: Scan tracked client source and Pages candidate
        run: npm run check:client-secrets

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run Chromium, Firefox, and WebKit acceptance
        run: npm run test:e2e

      - name: Upload clean Pages candidate
        uses: actions/upload-artifact@v7
        with:
          name: leai-pages-candidate-${{ github.sha }}
          path: dist/pages
          if-no-files-found: error
          retention-days: 7

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.sha }}
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 7
